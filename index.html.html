<html>
    <head>
        <title>FORM</title>
    </head>
     <body>
        <h1>Student Registration From</h1>
            <form action="#">
                <label for="">Roll no. :</label>
                <input type="text"> <br><br>

                <label for="">Student name :</label>
                <input type="text" placeholder="First Name" > -
                <input type="text" placeholder="Last Name" ><br><br>

                <label for="">Father's name :</label>
                <input type="text"> <br><br>
                
                <label for="">Date of birth :</label>
                <input type="text" placeholder="Day"> - 
                <input type="text" placeholder="Month"> - 
                <input type="text" placeholder="Year"> 
                <input type="date"><br><br>

                <label for="">Mobile no. :</label>
                <input type="tel" placeholder="+91"> - 
                <input type="number"> <br><br>
                
                <label for="">Email id :</label>
                <input type="text"> <br><br>

                <label for="">Password :</label>
                <input type="text"> <br><br>

                <label for="">Gender :</label>
                <input type="radio"> Male
                <input type="radio"> Female <br><br>

                <label for="">Department :</label>
                <input type="checkbox"> CSE
                <input type="checkbox"> IT
                <input type="checkbox"> ECE
                <input type="checkbox"> Civil
                <input type="checkbox"> Mech  <br><br>

                <label for="">Course :</label>
                <input type="dropdown" placeholder="-- Select Current Course's --"> <br><br>

                <label for="">Student photo :</label>
                <input type="file"> <br><br>

                <label for="">City :</label>
                <input type="text"> <br><br>

                <label for="">Address :</label>
                <input type="text"> <br><br>

                <input type="submit">

            
            </form>
     </body>
    
</html>
